# The Azure Static Web App this workflow deployed to no longer exists (see
# ISSUES.md E13 / C1-C6): the whole Azure footprint behind it was torn down.
# Deploying is disabled until a real hosting target is chosen again — do not
# re-add the deploy step without one. This now only validates that the web
# build still succeeds on every push to main.
name: Build Azure Static Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-static-web-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Export web app
        run: npm run export:web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_INGEST_API_URL: ${{ secrets.EXPO_PUBLIC_INGEST_API_URL }}
          EXPO_PUBLIC_INGEST_API_KEY: ${{ secrets.EXPO_PUBLIC_INGEST_API_KEY }}
          EXPO_PUBLIC_PROVISION_API_URL: ${{ secrets.EXPO_PUBLIC_PROVISION_API_URL }}
